[workspace]
resolver = "2"
members = ["crates/roomboard-core", "crates/roomboard-wasm", "crates/roomboard-shell", "crates/roomboard-formats", "crates/roomboard-formats-wasm"]
# src-tauri est exclu : son build monte à ~7,5 Go de RAM. Il a son propre Cargo.lock.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[profile.release]
opt-level = "s"
lto = true
# Taille du module Wasm (OD55, mesures dans docs/essais/taille-wasm.md). Posé sur le seul
# paquet roomboard-wasm, il est sans effet : il vaut donc pour tout le workspace. La section `name` est retirée par
# `wasm-bindgen --remove-name-section`, pas par `strip` (qui retirerait `target_features`).
codegen-units = 1
