[workspace]
resolver = "2"
members = ["crates/roomboard-core", "crates/roomboard-wasm"]
# src-tauri est exclu : son build monte à ~7,5 Go de RAM. Il a son propre Cargo.lock.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[profile.release]
opt-level = "s"
lto = true
