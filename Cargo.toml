[workspace]
resolver = "2"
members = ["crates/roomboard-core", "crates/roomboard-wasm", "crates/roomboard-shell", "crates/roomboard-formats"]
# src-tauri est exclu : son build monte à ~7,5 Go de RAM. Il a son propre Cargo.lock.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[profile.release]
opt-level = "s"
lto = true
# Taille du module Wasm (OD55, mesures dans docs/essais/taille-wasm.md) :
# strip retire la section `name` et les symboles, pas les chaînes des messages d'erreur.
strip = true
codegen-units = 1
