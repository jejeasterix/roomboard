[package]
name = "roomboard-desktop"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
# generate_context! embarque la configuration des plugins (plugins.fs) en serde_json::Value.
serde_json = "1"
# Logique de la coque testable sans Tauri (lot 5b, CL5b-14) : fichiers accordés, lecture bornée, lancement.
roomboard-shell = { path = "../../../crates/roomboard-shell" }
serde = { version = "1", features = ["derive"] }
