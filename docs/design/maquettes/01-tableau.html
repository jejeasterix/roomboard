* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { font-family: var(--rf-font); color: var(--rf-gray-800); font-size: 16px; -webkit-font-smoothing: antialiased; }

.island { position: absolute; display: flex; align-items: center; gap: var(--rf-space-xs); padding: var(--rf-space-xs);

.island.v { flex-direction: column; }
.btn { width: var(--rb-btn); height: var(--rb-btn); display: grid; place-items: center; border-radius: var(--rf-radius-lg); color: var(--rf-navy-500); position: relative; }
.btn.hover { background: var(--rf-gray-50); }
.btn.on { background: var(--rf-violet-100); color: var(--rf-violet-700); }
.btn.off { color: var(--rf-gray-500); }
.btn.primary { background: var(--rf-violet-600); color: var(--rf-white); }
.btn .key { position: absolute; right: 4px; bottom: 2px; font-size: 10px; line-height: 1; color: var(--rf-text-muted-aa); font-weight: 500; }
.btn.on .key { color: var(--rf-violet-700); }
.sep { width: 1px; height: 24px; background: var(--rf-gray-300); margin: 0 var(--rf-space-xs); flex: none; }
.island.v .sep { width: 24px; height: 1px; margin: var(--rf-space-xs) 0; }
.grip { width: 24px; height: var(--rb-btn); display: grid; place-items: center; color: var(--rf-gray-500); }
.grip .ic { width: 24px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; display: block; }
.btn.on .swatch, .swatch.on { box-shadow: 0 0 0 2px var(--rf-white), 0 0 0 4px var(--rf-violet-600); }
.btn.sw.on { background: transparent; }
.width { width: 24px; border-radius: 99px; background: var(--rf-navy-500); display: block; }
.tip { position: absolute; padding: 6px 10px; background: var(--rf-navy-500); color: var(--rf-white); font-size: 14px; font-weight: 500;
  line-height: 20px; border-radius: var(--rf-radius-md); white-space: nowrap; box-shadow: var(--rf-shadow-card); transform: translateX(-50%); }
.tip.light { background: var(--rf-white); color: var(--rf-navy-500); box-shadow: 0 0 0 1px var(--rf-gray-300), var(--rf-shadow-card); }
.tip kbd { font: inherit; color: var(--rf-gray-300); margin-left: 8px; }
.txt { font-size: 15px; font-weight: 500; color: var(--rf-navy-500); font-variant-numeric: tabular-nums; padding: 0 var(--rf-space-sm); }

body { background: var(--rf-gray-50); }
.page { position: absolute; left: 260px; top: 152px; width: 1400px; height: 788px; background: var(--rf-white); border-radius: var(--rf-radius-sm); box-shadow: 0 0 0 1px var(--rf-gray-300), var(--rf-shadow-card); }
.page svg.ink { position: absolute; inset: 0; }
.page .title { position: absolute; left: 96px; top: 72px; font-size: 56px; font-weight: 600; color: var(--ink-black); letter-spacing: -0.01em; }
.page .consigne { position: absolute; left: 820px; top: 210px; width: 440px; height: 128px; border: 3px solid var(--ink-black); display: grid; place-items: center; font-size: 30px; font-weight: 500; color: var(--ink-black); }
.tabs { left: 80px; top: 16px; padding: 4px; }
.tab { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px; border-radius: var(--rf-radius-lg); font-size: 15px; font-weight: 500; color: var(--rf-gray-800); }
.tab.on { background: var(--rf-violet-100); color: var(--rf-violet-700); font-weight: 600; }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rf-violet-600); }
.tab .x { width: 44px; height: 44px; display: grid; place-items: center; color: var(--rf-text-muted-aa); border-radius: var(--rf-radius-md); }
.tab.on .x { color: var(--rf-violet-700); }
.menu { position: absolute; left: 16px; top: 80px; width: 320px; padding: 8px; background: var(--rf-white); border-radius: var(--rf-radius-xl); box-shadow: 0 0 0 1px var(--rf-gray-300), var(--rf-shadow-modal); }
.row { height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-radius: var(--rf-radius-lg); font-size: 16px; color: var(--rf-gray-800); }
.row .ic { color: var(--rf-navy-500); }
.row kbd { margin-left: auto; font: 500 13px var(--rf-font); color: var(--rf-text-muted-aa); }
.row.hover { background: var(--rf-gray-50); }
.row.hover kbd { color: var(--rf-gray-800); }
.row .chev { margin-left: auto; color: var(--rf-text-muted-aa); }
.mdiv { height: 1px; background: var(--rf-gray-300); margin: 8px 4px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 8px 12px 4px; font-size: 13px; color: var(--rf-text-muted-aa); }
.brand b { font-weight: 600; color: var(--rf-navy-500); font-size: 15px; }
