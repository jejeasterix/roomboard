<title>RoomBoard — maquette 02 : annotation du bureau</title>
<!-- Maquette statique RoomBoard (cadrage design, docs/plans/design-cadrage.md). Autonome : CSS et icônes en ligne.
     Icônes : Lucide (ISC, lucide.dev, lucide-icons/lucide@7981a0798a) ; i-annotate, i-eraser-part, i-line dessinées pour RoomBoard.
     Logo : roomflow-app-icon.svg de roomflow2 (RoomFlow2.App/Assets/Logos), tel quel. Rendu de référence : 1920 x 1080, devicePixelRatio 2, Chromium --disable-lcd-text.
     Police : Inter par local() ; sans Inter installée, repli sur Segoe UI ou la police du système (les PNG du dépôt sont rendus avec Inter). -->
<style>
/* Jetons de la charte RoomFlow : source de chaque valeur dans docs/design/charte.md.
   rf2 = roomflow2@ddaba7ca RoomFlow2.App/Themes ; web = roomflow2-web@07cc047c src/index.css */
:root {
  --rf-violet-600: #6044EB; /* rf2 Tokens.Base.xaml:12 RF.Base.Violet600Color = RF.Accent.Brush */
  --rf-violet-700: #4F35C4; /* rf2 Tokens.Base.xaml:13 = RF.Accent.HoverBrush */
  --rf-violet-400: #8B6FEF; /* rf2 Tokens.Base.xaml:14 = RF.Nav.AccentBrush (accent sur fond sombre) */
  --rf-violet-100: #EDE8FD; /* rf2 Tokens.Base.xaml:15 = RF.Accent.SubtleBrush */
  --rf-navy-900: #0D1B2A;   /* rf2 Tokens.Base.xaml:18 */
  --rf-navy-700: #1E3355;   /* rf2 Tokens.Base.xaml:20 */
  --rf-navy-500: #182946;   /* rf2 Tokens.Base.xaml:22 = RF.Text.HeadingBrush, RF.Studio.TextBrush */
  --rf-gray-50: #F5F5F8;    /* rf2 Tokens.Base.xaml:26 = RF.App.BackgroundBrush, RF.Studio.CanvasBrush */
  --rf-gray-100: #FAFAFE;   /* rf2 Tokens.Base.xaml:27 */
  --rf-gray-300: #E0E0E8;   /* rf2 Tokens.Base.xaml:28 = RF.Border.Brush */
  --rf-gray-500: #888888;   /* rf2 Tokens.Base.xaml:29 = RF.Text.SecondaryBrush (icône désactivée seulement) */
  --rf-gray-800: #333333;   /* rf2 Tokens.Base.xaml:30 = RF.Text.PrimaryBrush */
  --rf-text-muted-aa: #6B7280; /* web index.css:34 --color-text-muted-aa (texte secondaire lisible) */
  --rf-white: #FFFFFF;      /* rf2 Tokens.Base.xaml:31 */
  --rf-danger: #E74C3C;     /* rf2 Tokens.Base.xaml:44 = RF.Status.DangerBrush */
  --rf-success: #27AE60;    /* rf2 Tokens.Base.xaml:36 = RF.Status.SuccessBrush */
  --rf-shadow-card: 0 2px 8px rgba(24, 41, 70, 0.08);   /* web index.css:63 = RF.Shadow.Card */
  --rf-shadow-hover: 0 6px 16px rgba(24, 41, 70, 0.12); /* web index.css:64 = RF.Shadow.Hover */
  --rf-shadow-modal: 0 13px 27px rgba(24, 41, 70, 0.15); /* web index.css:65 = RF.Shadow.Modal */
  --rf-radius-sm: 4px; --rf-radius-md: 6px; --rf-radius-lg: 8px; --rf-radius-xl: 12px; /* rf2 Tokens.Semantic.xaml:99-102 */
  --rf-space-xs: 4px; --rf-space-sm: 8px; --rf-space-md: 16px; --rf-space-lg: 24px; --rf-space-xl: 32px; /* rf2 Tokens.Semantic.xaml:91-95 */
  --rf-font: "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; /* rf2 Tokens.Semantic.xaml:77 */
  /* Contenu de la page (pas la charte) : préréglages du profil fourni, apps/web/src/toolbar-profiles.ts:62-64 et toolbar.ts:159 */
  --ink-black: #000000; --ink-red: #dc2626; --ink-blue: #1d4ed8; --fill-blue: #bfdbfe;
  /* RoomBoard : cible tactile et icône (décisions du cadrage, D-DS3 et D-DS4) */
  --rb-btn: 48px; --rb-icon: 24px;
}
@font-face { font-family: "Inter"; font-weight: 400; src: local("Inter"), local("Inter Regular"), local("Inter-Regular"); }
@font-face { font-family: "Inter"; font-weight: 500; src: local("Inter Medium"), local("Inter-Medium"); }
@font-face { font-family: "Inter"; font-weight: 600; src: local("Inter SemiBold"), local("Inter-SemiBold"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { font-family: var(--rf-font); color: var(--rf-gray-800); font-size: 16px; -webkit-font-smoothing: antialiased; }
.ic { width: var(--rb-icon); height: var(--rb-icon); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.island { position: absolute; display: flex; align-items: center; gap: var(--rf-space-xs); padding: var(--rf-space-xs);
  background: var(--rf-white); border-radius: var(--rf-radius-xl); box-shadow: 0 0 0 1px var(--rf-gray-300), var(--rf-shadow-hover); }
.island.v { flex-direction: column; }
.btn { width: var(--rb-btn); height: var(--rb-btn); display: grid; place-items: center; border-radius: var(--rf-radius-lg); color: var(--rf-navy-500); position: relative; }
.btn.hover { background: var(--rf-gray-50); }
.btn.on { background: var(--rf-violet-100); color: var(--rf-violet-700); }
.btn.off { color: var(--rf-gray-500); }
.btn.primary { background: var(--rf-violet-600); color: var(--rf-white); }
.btn .key { position: absolute; right: 4px; bottom: 2px; font-size: 10px; line-height: 1; color: var(--rf-text-muted-aa); font-weight: 500; }
.btn.on .key { color: var(--rf-violet-700); }
.sep { width: 1px; height: 24px; background: var(--rf-gray-300); margin: 0 var(--rf-space-xs); flex: none; }
.island.v .sep { width: 24px; height: 1px; margin: var(--rf-space-xs) 0; }
.grip { width: 24px; height: var(--rb-btn); display: grid; place-items: center; color: var(--rf-gray-500); }
.grip .ic { width: 24px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; display: block; }
.btn.on .swatch, .swatch.on { box-shadow: 0 0 0 2px var(--rf-white), 0 0 0 4px var(--rf-violet-600); }
.btn.sw.on { background: transparent; }
.width { width: 24px; border-radius: 99px; background: var(--rf-navy-500); display: block; }
.tip { position: absolute; padding: 6px 10px; background: var(--rf-navy-500); color: var(--rf-white); font-size: 14px; font-weight: 500;
  line-height: 20px; border-radius: var(--rf-radius-md); white-space: nowrap; box-shadow: var(--rf-shadow-card); transform: translateX(-50%); }
.tip.light { background: var(--rf-white); color: var(--rf-navy-500); box-shadow: 0 0 0 1px var(--rf-gray-300), var(--rf-shadow-card); }
.tip kbd { font: inherit; color: var(--rf-gray-300); margin-left: 8px; }
.txt { font-size: 15px; font-weight: 500; color: var(--rf-navy-500); font-variant-numeric: tabular-nums; padding: 0 var(--rf-space-sm); }

/* Bureau neutre : dégradé des bleus nuit de la charte, aucune capture d'un vrai bureau. */
body { background: linear-gradient(160deg, var(--rf-navy-700) 0%, var(--rf-navy-900) 100%); }
.win { position: absolute; left: 330px; top: 190px; width: 1260px; height: 740px; background: var(--rf-white); border-radius: var(--rf-radius-lg); box-shadow: var(--rf-shadow-modal); overflow: hidden; }
.win .bar { height: 40px; background: var(--rf-gray-50); border-bottom: 1px solid var(--rf-gray-300); }
.blk { position: absolute; background: var(--rf-gray-300); border-radius: var(--rf-radius-sm); }
.blk.l { background: var(--rf-gray-50); }
.frame { position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--rf-violet-600); pointer-events: none; }
.seg { display: flex; padding: 0; gap: 0; background: var(--rf-gray-50); border-radius: var(--rf-radius-lg); }
.split { display: flex; gap: 2px; }
.split .btn.more { width: 44px; }
.drop { width: 96px; height: var(--rb-btn); border: 1.5px dashed var(--rf-gray-500); border-radius: var(--rf-radius-lg); display: grid; place-items: center; color: var(--rf-navy-500); }
.task { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: var(--rf-navy-900); opacity: 0.6; }
.toast { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--rf-white); border-radius: var(--rf-radius-xl); box-shadow: 0 0 0 1px var(--rf-gray-300), var(--rf-shadow-hover); font-size: 16px; color: var(--rf-gray-800); }
.toast .ok { width: 32px; height: 32px; border-radius: 50%; background: var(--rf-success); color: var(--rf-white); display: grid; place-items: center; }

.toast b { font-weight: 600; color: var(--rf-violet-700); }
</style></head>
